<div class="border border-surface-200 dark:border-surface-700 rounded-lg overflow-hidden h-screen">
  <p-sidebar-layout class="min-h-screen relative">
    <app-sidebar (sidebarState)="handleSidebarState($event)" />

    <p-sidebar-main>
      <header
        class="flex h-12 items-center gap-2 border-b border-surface-200 dark:border-surface-700 px-4"
      >
        <button pButton pSidebarTrigger target="mobile-nav" severity="secondary" text size="small">
          <i class="pi pi-bars"></i>
        </button>
        <span class="text-sm font-medium">Dashboard</span>
        <span
          class="ml-auto text-xs text-muted-color rounded-md bg-surface-100 dark:bg-surface-800 px-2 py-1"
          >{{ viewState() }}</span
        >
      </header>

      <div class="flex-1 p-4 flex flex-col gap-4">
        <router-outlet />
      </div>
    </p-sidebar-main>
  </p-sidebar-layout>
</div>
