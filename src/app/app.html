@if (firstSegment() == 'login') {
  <router-outlet></router-outlet>
} @else {
  <div class="border border-gray-200 dark:border-gray-700 rounded-lg overflow-hidden h-screen">
    <p-sidebar-layout class="h-full relative flex">
      <app-sidebar [userName]="username" (sidebarState)="handleSidebarState($event)" />

      <p-sidebar-main class="flex flex-col h-full min-h-0">
        <header
          class="flex h-12 shrink-0 items-center gap-2 border-b border-gray-200 dark:border-gray-700 px-4"
        >
          <button
            pButton
            pSidebarTrigger
            target="mobile-nav"
            severity="secondary"
            text
            size="small"
          >
            <i class="pi pi-bars"></i>
          </button>
          <span class="text-sm font-medium">Dashboard</span>
          <span
            class="ml-auto text-xs text-muted-color rounded-md bg-gray-100/10 dark:bg-gray-800 px-2 py-1"
            >{{ viewState() }}</span
          >
        </header>

        <div class="flex-1 min-w-0 min-h-0 overflow-y-auto">
          <router-outlet></router-outlet>
        </div>
      </p-sidebar-main>
    </p-sidebar-layout>
  </div>
}
