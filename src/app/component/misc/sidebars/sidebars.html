@if (isMobile()) {
  <p-sidebar-backdrop class="absolute!" />
}

<p-sidebar
  id="mobile-nav"
  [collapsible]="isMobile() ? 'offcanvas' : 'icon'"
  [overlay]="isMobile()"
  [(open)]="sidebarOpen"
  width="14rem"
  class="border-r-gray-600"
>
  <p-sidebar-spacer />
  <p-sidebar-aside class="border-r border-r-gray-600/50">
    <p-sidebar-panel>
      <p-sidebar-header class="px-2 py-2">
        <p-sidebar-menu>
          <p-sidebar-menu-item>
            <button pSidebarMenuButton class="p-1!">
              <img
                src="favicon/favicon-96x96.png"
                alt="Buzz buzz buzzz"
                class="flex size-6 shrink-0"
              />

              <span class="font-semibold text-sm">Addinson's Halte 🥀</span>
            </button>
          </p-sidebar-menu-item>
        </p-sidebar-menu>
      </p-sidebar-header>

      <p-sidebar-content>
        @for (group of menuGroups(); track group.label) {
          <p-sidebar-group>
            <p-sidebar-group-label
              class="px-3 py-2 text-xs font-semibold text-muted-color uppercase tracking-wider"
            >
              {{ group.label }}
            </p-sidebar-group-label>

            <p-sidebar-group-content>
              <p-sidebar-menu class="flex flex-col gap-3">
                @for (item of group.items; track item.label) {
                  <p-sidebar-menu-item>
                    <a
                      pSidebarMenuButton
                      [routerLink]="item.route"
                      routerLinkActive="bg-gray-100 dark:bg-gray-600/20 font-medium"
                      [routerLinkActiveOptions]="{ exact: true }"
                      #rla="routerLinkActive"
                      [isActive]="rla.isActive"
                      (click)="onNavClick()"
                      class="flex items-center gap-3 px-1.5 py-2 w-full rounded-md hover:bg-gray-100 dark:hover:bg-gray-600/10 transition-colors cursor-pointer"
                    >
                      <i [class]="item.icon + ' shrink-0 text-lg'"></i>
                      <span class="ms-2">{{ item.label }}</span>

                      @if (item.badge) {
                        <p-sidebar-menu-badge class="ml-auto bg-green-400/50 text-white">
                          {{ item.badge }}
                        </p-sidebar-menu-badge>
                      }
                    </a>
                  </p-sidebar-menu-item>
                }
              </p-sidebar-menu>
            </p-sidebar-group-content>
          </p-sidebar-group>
        }
      </p-sidebar-content>

      <p-sidebar-footer class="px-1 py-3 border-t border-gray-200 dark:border-gray-700">
        <p-sidebar-menu>
          <p-sidebar-menu-item>
            <button
              pSidebarMenuButton
              (mouseenter)="onAvatarHover($event, op)"
              (mouseleave)="onAvatarLeave(op)"
              (click)="op.toggle($event)"
              class="flex items-center gap-3 p-0.5 w-full rounded-md hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors cursor-pointer"
            >
              <img src="pfp-pernahmalam.gif" class="rounded-full w-8 h-8 object-cover" />
              <div class="flex flex-col text-left">
                <span class="text-[0.625rem] font-mono text-gray-300/50 uppercase">User</span>
                <span class="font-medium text-sm truncate max-w-30">{{ userName }}</span>
              </div>
            </button>
          </p-sidebar-menu-item>
        </p-sidebar-menu>

        <p-popover #op appendTo="body" [dismissable]="true">
          <div
            (mouseenter)="cancelLeave()"
            (mouseleave)="onPopoverLeave(op)"
            class="flex flex-col w-52 text-white"
          >
            <!-- User summary header -->
            <div class="flex items-center gap-2.5 pb-2.5 border-b border-gray-700/60">
              <img
                src="pfp-pernahmalam.gif"
                class="rounded-full w-8 h-8 object-cover border border-gray-600"
              />
              <div class="flex flex-col min-w-0">
                <span class="text-xs font-semibold text-gray-200 truncate">{{ userName }}</span>
                <span class="text-[10px] text-emerald-400 flex items-center gap-1 font-mono">
                  <span
                    class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block animate-pulse"
                  ></span>
                  Active
                </span>
              </div>
            </div>

            <!-- Menu actions -->
            <div class="pt-2">
              <button
                type="button"
                (click)="onSignOut(op)"
                class="flex items-center gap-2.5 px-2.5 py-2 w-full text-left text-xs font-medium text-red-400 hover:text-red-300 hover:bg-red-500/10 rounded-md transition-colors cursor-pointer group"
              >
                <i
                  class="pi pi-sign-out text-sm text-red-400 group-hover:text-red-300 transition-colors"
                ></i>
                <span>Sign Out</span>
              </button>
            </div>
          </div>
        </p-popover>
      </p-sidebar-footer>
    </p-sidebar-panel>
  </p-sidebar-aside>
</p-sidebar>
